---
name: Lint Scripts

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: read # Set default read-only permissions

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run shellcheck
        run: shellcheck -s sh -x scripts/*.sh
