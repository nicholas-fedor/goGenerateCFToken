---
name: Lint Scripts

on:
  workflow_dispatch: {}
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"

permissions:
  contents: read # Set default read-only permissions

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run shellcheck
        run: shellcheck -s sh -x scripts/*.sh
