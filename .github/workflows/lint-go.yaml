---
name: Lint Go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - tools/**
      - build/golangci-lint/**
      - go.mod
      - go.sum
      - main.go

permissions:
  contents: read # Set default read-only permissions

jobs:
  lint:
    name: Run Golangci-lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden the Runner (Step Security)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          cache: true
          cache-dependency-path: "**/go.sum"
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          args: --timeout=5m --config=build/golangci-lint/golangci.yaml
          # Report and fail on findings anywhere in the tree, not only on lines this pull
          # request changed. Scoping to the diff let a regression in an untouched file pass.
          only-new-issues: false
